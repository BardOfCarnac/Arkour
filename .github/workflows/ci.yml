name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Stamp build
        shell: bash
        run: |
          echo "VITE_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Upload site build
        uses: actions/upload-artifact@v4
        with:
          name: arkour-site
          path: dist
          if-no-files-found: error
          retention-days: 3
