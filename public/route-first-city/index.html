<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#030506" />
  <title>Arkour — Route-First Vertical City</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="viewport" aria-label="Arkour route-first vertical city prototype"></canvas>

  <div class="hud">
    <section class="panel title-panel">
      <strong>ARKOUR // ROUTE-FIRST CITY</strong>
      <span>surface mirror → access point → opaque vertical megastructure</span>
    </section>

    <section class="panel status-panel">
      <span class="eyebrow">TRAVERSAL STATE</span>
      <strong id="stage">SURFACE APPROACH</strong>
      <span id="safety">ROUTE ENVELOPE: HARD RESERVED</span>
      <div class="progress"><i id="progress"></i></div>
    </section>

    <section class="panel legend-panel">
      <span><b>RED</b> traversal rail</span>
      <span><b>TEAL</b> hard-shell architecture</span>
      <span>Opaque pieces are rejected if they intersect any route or camera keep-out volume.</span>
    </section>

    <section class="controls" aria-label="Prototype controls">
      <button id="play" type="button">PAUSE</button>
      <button id="reset" type="button">RESET</button>
      <button id="clearance" type="button">SHOW CLEARANCE</button>
      <label>CITY <input id="density" type="range" min="0" max="1.25" step="0.05" value="0.65" /></label>
      <input id="scrub" class="scrub" type="range" min="0" max="1" step="0.001" value="0" aria-label="Timeline" />
    </section>
  </div>

  <script type="module" src="./demo.js"></script>
</body>
</html>
