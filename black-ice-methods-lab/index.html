<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#020506" />
  <title>Arkour — Black ICE Methods Lab</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="lab-shell">
    <header class="topbar">
      <div><strong>ARKOUR // BLACK ICE METHOD LAB</strong><span>same panther · three runtime strategies</span></div>
      <div class="fps"><b id="fps">--</b><span>FPS</span></div>
    </header>

    <nav class="method-tabs" aria-label="Runtime method">
      <button class="method active" data-mode="live" type="button"><b>A · LIVE</b><span>full mesh mask</span></button>
      <button class="method" data-mode="proxy" type="button"><b>B · PROXY</b><span>bones + volumes</span></button>
      <button class="method" data-mode="baked" type="button"><b>C · BAKED</b><span>directional impostor</span></button>
    </nav>

    <section class="stage" id="stage">
      <canvas id="view"></canvas>
      <div class="stage-message" id="stage-message">LOADING PANTHER…</div>
      <div class="gesture-hint">DRAG TO ORBIT · PINCH TO ZOOM</div>
      <div class="bake-progress" id="bake-progress" hidden><span id="bake-bar"></span></div>
    </section>

    <section class="controls">
      <label><span>ANIMATION</span><select id="clip"></select></label>
      <label><span>SPEED <output id="speed-out">1.00</output></span><input id="speed" type="range" min="0" max="2" step="0.01" value="1" /></label>
      <label><span>ZOOM <output id="zoom-out">1.00</output></span><input id="zoom" type="range" min="0.55" max="2.2" step="0.01" value="1" /></label>
      <label><span>THICK EDGE <output id="edge-out">7</output></span><input id="edge" type="range" min="2" max="16" step="1" value="7" /></label>
      <label><span>EDGE BREAKUP <output id="rough-out">0.30</output></span><input id="rough" type="range" min="0" max="0.85" step="0.01" value="0.30" /></label>
      <label><span>BLACK CORE <output id="core-out">0.78</output></span><input id="core" type="range" min="0" max="1" step="0.01" value="0.78" /></label>
      <label><span>MASK SCALE</span><select id="mask-size"><option value="128">128</option><option value="160">160</option><option value="192" selected>192</option><option value="256">256</option></select></label>
      <div class="control-buttons">
        <button id="animate" class="active" type="button">ANIMATE: ON</button>
        <button id="bake" type="button">BAKE C</button>
        <button id="reset" type="button">RESET VIEW</button>
      </div>
      <p id="note">A renders the full skinned panther into a low-resolution GPU mask every frame.</p>
    </section>
  </main>
  <script type="module" src="/src/black-ice-methods-lab.js"></script>
</body>
</html>
